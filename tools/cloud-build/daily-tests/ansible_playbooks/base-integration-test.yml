---

- name: "Setup Integration tests for Cluster Toolkit"
  hosts: localhost
  tasks:
  ## Display Terraform Version
  - name: "Get Terraform Version"
    ansible.builtin.command: terraform version
    changed_when: false
    register: terraform_version_output

  - name: "Print Terraform Version"
    ansible.builtin.debug:
      msg: |
        ---- TERRAFORM VERSION ----
        {{ terraform_version_output.stdout }}
        ---------------------------

  ## Create SSH Keys
  - name: "Create .ssh folder"
    ansible.builtin.file:
      path: "/builder/home/.ssh"
      state: directory
      mode: 0700

  - name: Create SSH Key
    community.crypto.openssh_keypair:
      path: "/builder/home/.ssh/id_rsa"

  ## Get builder IP address
  - name: Get Builder IP
    register: build_ip
    changed_when: false
    args:
      executable: /bin/bash
    ansible.builtin.shell: |
      set -e -o pipefail
      dig TXT +short o-o.myaddr.l.google.com @ns1.google.com | \
          awk -F'"' '{print $2}'

  ## Create cluster
  - name: Create Deployment Directory
    ansible.builtin.include_tasks:
      file: tasks/create_deployment_directory.yml

  - name: Create Infrastructure and test
    block:
    - name: Create Cluster with gcluster
      register: deployment
      changed_when: deployment.changed
      ansible.builtin.command: ./gcluster deploy {{ deployment_name }} --auto-approve
      args:
        chdir: "{{ workspace }}"
      environment:
        TF_IN_AUTOMATION: "TRUE"

    - name: Print instance IDs of VMs
      ansible.builtin.include_tasks:
        file: tasks/get_instance_ids.yml

    - name: Get IP of the remote node - Exact name provided
      changed_when: false
      register: get_remote_ip
      ansible.builtin.command: >-
        gcloud compute instances describe --zone={{ zone }} {{ remote_node }}
        --format='get(networkInterfaces[0].accessConfigs[0].natIP)'
      when: '"*" not in remote_node'

    # Setting a fact is needed because the variable will overwrite itself even
    # if a task is skipped, leading to an undefined variable when the exact name
    # is provided.
    - name: Set remote_ip variable - Exact name provided
      ansible.builtin.set_fact:
        remote_ip: "{{ get_remote_ip.stdout }}"
      when: '"*" not in remote_node'

    - name: Get IP of the remote node - Name pattern provided
      changed_when: false
      register: get_remote_ip
      ansible.builtin.command: >-
        gcloud compute instances list \
          --format='get(networkInterfaces[0].accessConfigs[0].natIP)' --limit=1 \
          --filter=NAME:{{ remote_node }}
      when: '"*" in remote_node'

    - name: Set remote_ip variable - Name pattern provided
      ansible.builtin.set_fact:
        remote_ip: "{{ get_remote_ip.stdout }}"
      when: '"*" in remote_node'

    - name: Print remote node's public IP
      ansible.builtin.debug:
        var: remote_ip

    # Setup firewall for cloud build
    - name: Create firewall rule
      register: fw_result
      changed_when: fw_result.rc == 0
      ansible.builtin.command:
        argv:
        - gcloud
        - compute
        - --project={{ project }}
        - firewall-rules
        - create
        - "{{ deployment_name }}"
        - --direction=INGRESS
        - --priority=1000
        - --network={% if use_fixed_vpc | default(false) %}{{ test_prefix | default('') }}{{ test_name }}-0{% else %}{{ network }}{% endif %}
        - --action=ALLOW
        - --rules=tcp:22
        - --source-ranges={{ build_ip.stdout }}

    - name: 'Add SSH Keys to OS-Login'
      register: key_result
      changed_when: key_result.rc == 0
      ansible.builtin.command:
        argv:
        - gcloud
        - compute
        - os-login
        - ssh-keys
        - add
        - --ttl
        - 2h
        - "--key-file=/builder/home/.ssh/id_rsa.pub"

    - name: Add Remote node as host
      ansible.builtin.add_host:
        hostname: "{{ remote_ip }}"
        groups: [remote_host]
      when: (remote_ip | default('')) | ansible.utils.ipaddr != false

    - name: Wait for host tasks
      ansible.builtin.include_tasks: tasks/wait-for-host.yml
      vars:
        host_ip: "{{ remote_ip }}"
        ansible_ssh_private_key_file: "/builder/home/.ssh/id_rsa"

    ## Cleanup and fail gracefully
    rescue:
    - name: Capture gcluster stderr
      failed_when: false
      ansible.builtin.set_fact:
        gcluster_stderr: "{{ deployment.stderr | replace('\n',' ') }}"

    - name: Gather logs
      ansible.builtin.include_tasks:
        file: tasks/gather_startup_script_logs.yml
        apply:
          delegate_to: localhost

    - name: Include rescue from gcluster failure
      ansible.builtin.include_tasks:
        file: tasks/rescue_gcluster_failure.yml
        apply:
          delegate_to: localhost
      vars:
        deployment_name: "{{ deployment_name }}"
        workspace: "{{ workspace }}"

    - name: Trigger failure (rescue blocks otherwise revert failures)
      ansible.builtin.fail:
        msg: "Failed while setting up test infrastructure"

- name: Run Integration Tests
  hosts: remote_host
  vars:
    startup_timeout_seconds: 600  # 10 minutes
  gather_facts: false
  ignore_unreachable: true  # ensure always block will run even if SSH fails
  tasks:
  - name: Remote Test Block
    vars:
      ansible_ssh_private_key_file: "/builder/home/.ssh/id_rsa"

    block:
    - name: Include wait for startup script
      ansible.builtin.include_tasks: "tasks/wait-for-startup-script.yml"
      vars:
        timeout_seconds: "{{ startup_timeout_seconds }}"

    - name: Add instance labels for spot instances
      ansible.builtin.include_tasks: tasks/add-instance-labels.yml
      when: custom_vars is defined and custom_vars.enable_spot | default(false) | bool

    - name: Run Integration tests for Cluster Toolkit
      ansible.builtin.include_tasks: "{{ test }}"
      vars:
        remote_node: "{{ remote_node }}"
        deployment_name: "{{ deployment_name }}"
        custom_vars: "{{ custom_vars }}"
      loop: "{{ post_deploy_tests }}"
      loop_control:
        loop_var: test

    rescue:
    - name: Conditionally check for spot preemptions after a failure
      when: custom_vars is defined and custom_vars.enable_spot | default(false) | bool
      block:
      - name: Display test failure message
        ansible.builtin.debug:
          msg: "A task within the integration tests failed. Spot VMs are enabled, so running preemption checks."

      - name: Check for recent preemptions
        ansible.builtin.include_tasks: test-validation/test-preemption.yml

    - name: Propagate original failure after rescue tasks
      ansible.builtin.fail:
        msg: "Integration tests failed. Rescue tasks were executed."

    always:
    - name: Run failure triage agent and fetch report
      block:
      - name: Get Identity Token for Cloud Run
        ansible.builtin.command: gcloud auth print-identity-token
        register: gcloud_token
        changed_when: false

      - name: Trigger Failure Triage Agent
        ansible.builtin.uri:
          url: "https://failure-triage-agent-508417052821.us-central1.run.app/trigger"
          method: POST
          headers:
            Authorization: "Bearer {{ gcloud_token.stdout }}"
          body_format: json
          body:
            build_id: "{{ build }}"
            project_id: "{{ project }}"
          status_code: [200, 202]
        register: trigger_result
        retries: 1
        delay: 30
        until: trigger_result.status in [200, 202]
        ignore_errors: true

      - name: Wait for agent and poll GCS state file
        when: not trigger_result.failed
        block:
        - name: Initial wait 5 minutes
          ansible.builtin.pause:
            minutes: 5

        - name: Poll GCS state.json for complete status
          ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ build }}/state.json"
          register: state_poll
          until: (state_poll.stdout | default('{}', true) | from_json).status | default('') in ['complete', 'failed']
          retries: 30
          delay: 60
          ignore_errors: true
          changed_when: false

        - name: Final wait 5 minutes (if polling succeeded)
          ansible.builtin.pause:
            minutes: 5
          when:
          - not state_poll.failed
          - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'complete'

        - name: Get report from GCS
          ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ build }}/report.md"
          register: report_content
          ignore_errors: true
          changed_when: false
          when:
          - not state_poll.failed
          - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'complete'

        - name: Print Triage Report
          ansible.builtin.debug:
            msg: "{{ report_content.stdout }}"
          when:
          - not state_poll.failed
          - not report_content.failed
          - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'complete'

        - name: Handle Agent Timeout or Failure
          when: state_poll.failed or (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'failed'
          block:
          - name: Get latest state file manually
            ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ build }}/state.json"
            register: failed_state
            ignore_errors: true
            changed_when: false

          - name: Get log file
            ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ build }}/orchestrator_{{ build }}.log"
            register: failed_log
            ignore_errors: true
            changed_when: false

          - name: Inform about test timeout/failure (Silent Failure)
            vars:
              parsed_state: "{{ failed_state.stdout | default('{}', true) | from_json }}"
            ansible.builtin.debug:
              msg: >
                Failure Triage Agent testing did not complete in time or failed.
                Last known Status: {{ parsed_state.status | default('Unknown') }},
                Last known Stage: {{ parsed_state.stage | default('Unknown') }}.
                Logs: {{ failed_log.stdout | default('Not available') }}

    - name: Cleanup firewall and infrastructure
      ansible.builtin.include_tasks:
        file: tasks/rescue_gcluster_failure.yml
        apply:
          delegate_to: localhost
      vars:
        deployment_name: "{{ deployment_name }}"
        workspace: "{{ workspace }}"
