---
- name: Determine Full Build ID
  ansible.builtin.set_fact:
    triage_build_id: "{{ full_build_id | default('') }}"

- name: Warn if Build ID is missing
  when: triage_build_id == ""
  ansible.builtin.debug:
    msg: "No full_build_id provided. If running manually, append full_build_id=... to extra-vars to trigger the Failure Triage Agent. Skipping triage."

- name: Run failure triage agent and fetch report
  when: triage_build_id != ""
  block:
  - name: Get Identity Token for Cloud Run
    ansible.builtin.command: >
      curl -s -H "Metadata-Flavor: Google" "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/identity?audience=https://failure-triage-agent-508417052821.us-central1.run.app"
    register: gcloud_token
    changed_when: false

  - name: Trigger Failure Triage Agent
    ansible.builtin.command: >
      curl -s -f -X POST "https://failure-triage-agent-508417052821.us-central1.run.app/trigger"
      -H "Authorization: Bearer {{ gcloud_token.stdout }}"
      -H "Content-Type: application/json"
      -d '{"build_id": "{{ triage_build_id }}", "project_id": "{{ project }}"}'
    register: trigger_result
    retries: 1
    delay: 30
    until: trigger_result.rc == 0
    ignore_errors: true
    changed_when: false

  - name: Wait for agent and poll GCS state file
    when: not trigger_result.failed
    block:
    - name: Initial wait 5 minutes
      ansible.builtin.pause:
        minutes: 5

    - name: Poll GCS state.json for complete status
      ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ triage_build_id }}/state.json"
      register: state_poll
      until: (state_poll.stdout | default('{}', true) | from_json).status | default('') in ['complete', 'failed']
      retries: 30
      delay: 60
      ignore_errors: true
      changed_when: false

    - name: Final wait 5 minutes (if polling succeeded)
      ansible.builtin.pause:
        minutes: 5
      when:
      - not state_poll.failed
      - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'complete'

    - name: Get report from GCS
      ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ triage_build_id }}/report.txt"
      register: report_content
      ignore_errors: true
      changed_when: false
      when:
      - not state_poll.failed
      - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'complete'

    - name: Print Triage Report
      ansible.builtin.debug:
        msg: "{{ report_content.stdout }}"
      when:
      - not state_poll.failed
      - not report_content.failed
      - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'complete'

    - name: Handle Agent Timeout or Failure
      when: state_poll.failed or (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'failed'
      block:
      - name: Get latest state file manually
        ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ triage_build_id }}/state.json"
        register: failed_state
        ignore_errors: true
        changed_when: false

      - name: Inform about test timeout/failure (Silent Failure)
        vars:
          parsed_state: "{{ failed_state.stdout | default('{}', true) | from_json }}"
        ansible.builtin.debug:
          msg: |
            Failure Triage Agent testing did not complete in time or failed.
            Last known Status: {{ parsed_state.status | default('Unknown') }}
            Last known Stage: {{ parsed_state.stage | default('Unknown') }}

            Full State File:
            {{ failed_state.stdout | default('Not available') }}
