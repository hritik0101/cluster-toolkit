---
- name: Determine Full Build ID
  ansible.builtin.set_fact:
    triage_build_id: "{{ full_build_id | default('') }}"

- name: Warn if Build ID is missing
  when: triage_build_id == ""
  ansible.builtin.debug:
    msg: "No full_build_id provided. If running manually, append full_build_id=... to extra-vars to trigger the Failure Triage Agent. Skipping triage."

- name: Run failure triage agent and fetch report
  when: triage_build_id != ""
  block:
  - name: Get Identity Token for Cloud Run
    delegate_to: localhost
    ansible.builtin.command: >
      gcloud auth print-identity-token --impersonate-service-account="triage-invoker@hpc-toolkit-dev.iam.gserviceaccount.com" --audiences="https://failure-triage-agent-508417052821.us-central1.run.app"
    register: gcloud_token
    changed_when: false

  - name: Validate identity token
    delegate_to: localhost
    ansible.builtin.assert:
      that:
      - gcloud_token.stdout is defined
      - gcloud_token.stdout | length > 0
      - gcloud_token.stdout is match('^eyJ')
      fail_msg: "Identity token is invalid: {{ gcloud_token.stdout[:80] }}"

  - name: Trigger Failure Triage Agent
    delegate_to: localhost
    ansible.builtin.command: >
      curl -sf -X POST "https://failure-triage-agent-508417052821.us-central1.run.app/trigger"
      -H "Authorization: Bearer {{ gcloud_token.stdout }}"
      -H "Content-Type: application/json"
      -d '{"build_id": "{{ triage_build_id }}", "project_id": "508417052821"}'
    register: trigger_result
    retries: 1
    delay: 30
    until: trigger_result.rc == 0
    ignore_errors: true
    changed_when: false

  - name: Wait for agent and poll GCS state file
    when: not trigger_result.failed
    block:
    - name: Initial wait 5 minutes
      ansible.builtin.pause:
        minutes: 5

    - name: Poll GCS state.json for completed status
      delegate_to: localhost
      ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ triage_build_id }}/state.json"
      register: state_poll
      until: (state_poll.stdout | default('{}', true) | from_json).status | default('') in ['completed', 'failed']
      retries: 30
      delay: 60
      ignore_errors: true
      changed_when: false

    - name: Final wait 5 minutes (if polling succeeded)
      ansible.builtin.pause:
        minutes: 5
      when:
      - not state_poll.failed
      - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'completed'

    - name: Print Triage Report
      ansible.builtin.debug:
        msg: |
          TRIAGE EXECUTIVE SUMMARY:
          {{ (state_poll.stdout | default('{}', true) | from_json).executive_summary | default('No summary available.') }}

          Full forensic report available at:
          https://storage.cloud.google.com/g-ift-agent-bucket/{{ triage_build_id }}/report.txt
      when:
      - not state_poll.failed
      - (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'completed'

    - name: Handle Agent Timeout or Failure
      when: state_poll.failed or (state_poll.stdout | default('{}', true) | from_json).status | default('') == 'failed'
      block:
      - name: Get latest state file manually
        delegate_to: localhost
        ansible.builtin.command: "gcloud storage cat gs://g-ift-agent-bucket/{{ triage_build_id }}/state.json"
        register: failed_state
        ignore_errors: true
        changed_when: false

      - name: Inform about test timeout/failure (Silent Failure)
        vars:
          parsed_state: "{{ failed_state.stdout | default('{}', true) | from_json }}"
        ansible.builtin.debug:
          msg: |
            Failure Triage Agent testing did not complete in time or failed.
            Last known Status: {{ parsed_state.status | default('Unknown') }}
            Last known Stage: {{ parsed_state.stage | default('Unknown') }}

            State File Link:
            https://console.cloud.google.com/storage/browser/_details/g-ift-agent-bucket/{{ triage_build_id }}/state.json
